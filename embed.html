<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MusicPartyGame • dainos peržiūra</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
    #player,#player iframe{width:100%!important;height:100%!important;border:0}
    #notice{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#111;color:#fff;padding:18px;text-align:center;box-sizing:border-box;font-size:14px;z-index:2}
    #notice.visible{display:flex}
  </style>
</head>
<body>
<div id="player"></div><div id="notice" role="status"></div>
<script>
(()=>{
  'use strict';
  // Public static YouTube view. No MusicPartyGame API, session, token, state or search data.
  const id = new URL(location.href).searchParams.get('v') || '';
  const candidateOrigin = new URL(location.href).searchParams.get('parent_origin') || '';
  const videoOk = /^[A-Za-z0-9_-]{11}$/.test(id);
  let parentOrigin = null;
  try {
    const p = new URL(candidateOrigin);
    // Only accept an exact URL origin; reject paths, query strings and credentials.
    if (p.origin === candidateOrigin && !p.username && !p.password &&
        (p.protocol === 'http:' || p.protocol === 'https:')) parentOrigin = p.origin;
  } catch { /* This page can also run standalone without a parent. */ }
  const notice = document.getElementById('notice');
  let ready = false, playbackTimer = null;
  function send(state, code) {
    if (!parentOrigin || window.parent === window) return;
    try { window.parent.postMessage({protocol:'mpg-yt-preview-v1', videoId:id, state,
      ...(Number.isInteger(code) ? {errorCode:code} : {})},parentOrigin); }
    catch { /* A page without an authorized parent continues to work. */ }
  }
  function show(message, state) {
    notice.textContent = message;
    notice.classList.add('visible');
    send(state);
  }
  function clearTimer() { if (playbackTimer !== null) { clearTimeout(playbackTimer); playbackTimer=null; } }
  function startPlaybackWatch() {
    clearTimer();
    playbackTimer=setTimeout(()=>{
      playbackTimer=null;
      show('YouTube per 20 sek. nepradėjo groti. Pabandyk kitą įrašą.', 'playback_timeout');
    },20000);
  }
  window.addEventListener('error', e=>{
    if (e.target && e.target.tagName === 'SCRIPT') return; // Script.onerror handles API loading.
    send('js_error');
  });
  window.addEventListener('unhandledrejection',()=>send('promise_rejection'));
  if (!videoOk) { show('Neteisingas YouTube video ID.','invalid_id');return; }
  window.onYouTubeIframeAPIReady = () => {
    ready=true;
    try {
      new YT.Player('player', {
        width:'100%',height:'100%',videoId:id,host:'https://www.youtube.com',
        playerVars:{playsinline:1,enablejsapi:1,origin:location.origin,rel:0,controls:1},
        events:{
          onReady(){send('ready');},
          onStateChange(event){
            const state=event.data;
            if (state === 3) { send('buffering');startPlaybackWatch(); }
            else if (state === 1) {clearTimer();notice.classList.remove('visible');send('playing');}
            else if (state === 2) {clearTimer();send('paused');}
            else if (state === 0) {clearTimer();send('ended');}
          },
          onError(event){
            clearTimer();
            const code=Number(event.data);
            send('error',Number.isInteger(code)?code:undefined);
            notice.textContent='YouTube klaida'+(Number.isInteger(code)?' '+code:'')+'. Pasirink kitą įrašą.';
            notice.classList.add('visible');
          },
          onAutoplayBlocked(){clearTimer();send('autoplay_blocked');}
        }
      });
    } catch {
      clearTimer();show('Nepavyko paruošti YouTube grotuvo.','player_init_failed');
    }
  };
  const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';
  script.onerror=()=>{clearTimer();show('YouTube API nepavyko užkrauti.','api_failed');};
  document.head.appendChild(script);
  setTimeout(()=>{if(!ready)show('YouTube API neatsakė per 15 sek.','api_timeout');},15000);
})();
</script>
</body>
</html>
